<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <style>
    .min { transform-origin: 24px 24px; animation: spin 2s infinite linear; }
    .hr { transform-origin: 24px 24px; animation: spin 24s infinite linear; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <circle cx="24" cy="24" r="20" fill="#ffffff" stroke="#6e1f2a" stroke-width="2"/>
  <circle cx="24" cy="24" r="16" fill="#fdf5e6"/>
  <line x1="24" y1="8" x2="24" y2="10" stroke="#6e1f2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="38" x2="24" y2="40" stroke="#6e1f2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="24" x2="10" y2="24" stroke="#6e1f2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="40" y2="24" stroke="#6e1f2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="24" y2="12" stroke="#6e1f2a" stroke-width="2.5" stroke-linecap="round" class="min"/>
  <line x1="24" y1="24" x2="32" y2="24" stroke="#6e1f2a" stroke-width="3" stroke-linecap="round" class="hr"/>
  <circle cx="24" cy="24" r="3" fill="#6e1f2a"/>
</svg>
