<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <style>
    .page { transform-origin: 10px 24px; animation: flip 3s infinite ease-in-out; }
    .page-1 { animation-delay: 0s; }
    .page-2 { animation-delay: 0.2s; }
    @keyframes flip {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(-30deg); }
    }
  </style>
  <rect x="12" y="6" width="26" height="36" rx="3" fill="#fdf5e6" stroke="#6e1f2a" stroke-width="2"/>
  <rect x="10" y="6" width="26" height="36" rx="3" fill="#fbf5ea" stroke="#6e1f2a" stroke-width="2" class="page page-2"/>
  <rect x="8" y="6" width="26" height="36" rx="3" fill="#ffffff" stroke="#6e1f2a" stroke-width="2" class="page page-1"/>
  <line x1="14" y1="16" x2="28" y2="16" stroke="#6e1f2a" stroke-width="2" stroke-linecap="round" class="page page-1"/>
  <line x1="14" y1="24" x2="24" y2="24" stroke="#6e1f2a" stroke-width="2" stroke-linecap="round" class="page page-1"/>
  <line x1="14" y1="32" x2="30" y2="32" stroke="#6e1f2a" stroke-width="2" stroke-linecap="round" class="page page-1"/>
</svg>
